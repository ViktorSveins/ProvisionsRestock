name: Publish to CurseForge

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Check CurseForge settings
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo '::error::Set the CF_API_TOKEN repository secret to a CurseForge author upload token.'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package and publish Provisions Restock
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          pandoc: false
